name: social_media_app
description: A social media app using Flutter, Dart, GetX, and REST API that allows users to share their photos and videos.

publish_to: "none"

version: 1.1.0+32

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 2.0.0

  device_info_plus: 13.3.0
  package_info_plus: 10.2.2

  talker_flutter: 5.2.0

  flutter_svg: 2.5.0
  image_picker: 1.2.4
  image_cropper: 14.0.0
  photo_view: 0.15.0
  cached_network_image: 4.0.7
  flutter_carousel_widget: 4.0.2

  flutter_animate: 4.5.2
  rive: 0.14.11

  connectivity_plus: 7.3.2
  intl: 0.20.3
  get_time_ago: 3.0.2

  http: 1.6.0

  cloudinary: 2.1.2
  r_upgrade: 0.4.2

  libsignal_protocol_dart: 0.8.2

  hive_ce: 2.24.0
  flutter_secure_storage: 11.2.0

  url_launcher: 6.3.3
  flutter_linkify: 6.0.0
  share_plus: 13.3.1

  flutter_local_notifications: 23.0.4
  firebase_core: 5.2.0
  firebase_messaging: 17.1.0

  better_player: 1.39.0

  path: 1.9.1
  file_picker: 13.4.1
  path_provider: 2.1.6
  flutter_markdown_plus: 1.0.12
  flutter_image_compress: 2.5.1
  video_compress_ds: 3.1.6

  flutter_screenutil: 5.9.3
  permission_handler: 13.0.2
  flutter_datetime_picker_plus: 3.0.1

  # State Management
  get: 4.7.3
  get_storage: 2.1.1
  json_annotation: 4.12.0
  equatable: 3.0.0
  copy_with_extension: 18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8

  build_runner: 2.17.1
  hive_ce_generator: 1.12.1
  json_serializable: 6.15.2
  copy_with_extension_gen: 18.0.1
  flutter_secure_storage_platform_interface: 2.1.1
  url_launcher_platform_interface: 2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/rive/
    - assets/svgs/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic

    - family: Muge
      fonts:
        - asset: assets/fonts/MugeRegular.ttf
